[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sadtalker"
version = "0.0.2"
description = "SadTalker: Learning Realistic 3D Motion Coefficients for Stylized Audio-Driven Single Image Talking Face Animation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.20.1",
    "torchaudio==2.6.0",
    "numpy==1.23.4",
    "face_alignment==1.3.5",
    "imageio==2.19.3",
    "imageio-ffmpeg==0.4.7",
    "librosa==0.9.2",
    "numba",
    "resampy==0.3.1",
    "pydub==0.25.1",
    "scipy==1.10.1",
    "kornia==0.6.8",
    "tqdm",
    "yacs==0.1.8",
    "pyyaml",
    "joblib==1.1.0",
    "scikit-image==0.19.3",
    "basicsr==1.4.2",
    "facexlib==0.3.0",
    "gfpgan",
    "av",
    "safetensors",
]

[project.optional-dependencies]
3d = [
    "trimesh==3.9.20",
]

# uv users get the CUDA builds automatically via this index configuration
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
