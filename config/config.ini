# SadTalker Configuration File
# This file contains default configuration parameters for SadTalker

# Model Configuration
[model]
# Checkpoint directory
checkpoint_dir = checkpoints

# Use 256 or 512 face model
face_model_resolution = 256

# Mapping model version (00109 or 00229)
mapping_model = mapping_00229-model.pth.tar

[processing]
# Preprocessing mode: crop, resize, full, or extcrop
preprocess = crop

# Use still mode (for full body/image generation)
still_mode = false

# Reference video for pose (optional)
ref_pose =

# Reference video for expression (optional)
ref_eyeblink =

[enhancement]
# Face enhancer: gfpgan, RestoreFormer, or none
enhancer = gfpgan

# Background enhancer: realesrgan or none
background_enhancer =

[output]
# Result directory
result_dir = results

# Pose style (0-45)
pose_style = 0

# Expression scale (0.0-3.0)
exp_scale = 1.0

# Batch size for processing
batch_size = 1

# Size of face region
size = 256

[advanced]
# Use 3D face model
use_3dmm = true

# Face parsing for background
use_face_parsing = false

# Use idle mode
use_idle_mode = false

# Number of frames to skip in pose extraction
pose_fps = 25
